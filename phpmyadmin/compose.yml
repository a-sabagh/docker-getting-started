services:
  3309db:
    image: mysql:latest
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=root
    ports:
      - 3309:3306
    container_name: 3309db
  pma_client:
    image: phpmyadmin:latest
    restart: always
    ports:
      - 8082:80
    environment:
      - PMA_ARBITRARY=1
    container_name: pma_client